MOD_MCP_ASK="MCP - 詢問官網內容"
MOD_MCP_ASK_XML_DESCRIPTION="搜尋框形式的問答模組：依官網內容回答訪客的問題，並標示每段回答來自哪些頁面。"
MOD_MCP_ASK_FIELD_PET_LABEL="小寵物"
MOD_MCP_ASK_FIELD_PET_DESC="浮動按鈕換成一隻小寵物（「外觀」選「浮動按鈕」時才有作用）：一樣可以拖曳、點了在牠旁邊打開問答框，並依訪客的操作與回答播放待機、打招呼、思考、回答、開心、困惑、睡覺等動作；對話視窗打開時站在視窗右側。寵物在「官網內容問答 → 小寵物」管理，也可以使用內建的一隻。"
MOD_MCP_ASK_FIELD_SOURCES_SHOWN_LABEL="資料來源先顯示幾筆"
MOD_MCP_ASK_FIELD_SOURCES_SHOWN_DESC="回答右側的資料來源先列出幾筆，其餘收成「其他 N 筆」，點了才展開。0 為全部列出。"
