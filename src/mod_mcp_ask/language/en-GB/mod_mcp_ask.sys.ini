MOD_MCP_ASK="MCP - Ask the Site"
MOD_MCP_ASK_XML_DESCRIPTION="A search box that answers visitors' questions from the site's own content and names the pages each answer came from."
MOD_MCP_ASK_FIELD_PET_LABEL="Pet"
MOD_MCP_ASK_FIELD_PET_DESC="The floating button as a pet (with the "Floating button" look only): still dragged and pressed to ask, the box opening beside it, and moving as the visitor asks and is answered; it stands at the right while the conversation is open. Pets are kept under Ask the Site → Pets; one comes with the module."
MOD_MCP_ASK_FIELD_SOURCES_SHOWN_LABEL="Pages shown"
MOD_MCP_ASK_FIELD_SOURCES_SHOWN_DESC="How many pages are listed beside an answer before the rest are folded into "N more". 0 lists them all."
