PLG_TASK_MCPASK_XML_DESCRIPTION="Offers the scheduled task that synchronises the index of Ask the Site."
PLG_TASK_MCPASK_SYNC_TITLE="Ask the Site - Synchronise the index"
PLG_TASK_MCPASK_SYNC_DESC="Indexes content that became public or could not be indexed when it was saved, checks the rest for changes, and removes what is no longer public. Every 15 minutes to once an hour is a sensible interval."
