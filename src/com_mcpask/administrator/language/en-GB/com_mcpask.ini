COM_MCPASK_WEBSITES_STOP="Pause"
COM_MCPASK_WEBSITES_READING="Reading the websites… You can leave or reload this page: the reading goes on when you come back, and the scheduled task carries on meanwhile."
COM_MCPASK_WEBSITES_BUSY="The scheduled task is reading the websites right now; this continues when it is done."
COM_MCPASK_WEBSITES_STOPPED="Paused. The scheduled task carries on in its own time."
