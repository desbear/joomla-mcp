COM_MCPASK_CONFIG_SERVICE="AI service"
COM_MCPASK_CONFIG_SERVICE_DESC="The key and the models that are used. Changing the embedding model or its dimensions means the index has to be synchronised again."
COM_MCPASK_CONFIG_ENABLED="Answer questions"
COM_MCPASK_CONFIG_ENABLED_DESC="Switch off to stop answering without unpublishing the module."
COM_MCPASK_CONFIG_ACCESS="Who may ask"
COM_MCPASK_CONFIG_ACCESS_DESC="The access level a visitor needs to ask questions. Give the module the same access level. Answers are always written from public content only, whoever asks."
COM_MCPASK_CONFIG_API_KEY="API key"
COM_MCPASK_CONFIG_API_KEY_DESC="An OpenAI API key. It stays on this server and is never sent to visitors."
COM_MCPASK_CONFIG_CHAT_MODEL="Answer model"
COM_MCPASK_CONFIG_CHAT_MODEL_DESC="The model that writes the answers. A small, fast model is usually the right choice."
COM_MCPASK_CONFIG_REASONING="Reasoning effort"
COM_MCPASK_CONFIG_REASONING_DESC="Only for reasoning models; a lower effort starts the answer sooner. A model that does not reason is asked again without it."
COM_MCPASK_CONFIG_REASONING_NONE="Not sent"
COM_MCPASK_CONFIG_MAX_OUTPUT="Longest answer (tokens)"
COM_MCPASK_CONFIG_MAX_OUTPUT_DESC="Upper limit for one answer."
COM_MCPASK_CONFIG_EMBEDDING_MODEL="Embedding model"
COM_MCPASK_CONFIG_EMBEDDING_MODEL_DESC="The model that turns text into vectors for searching."
COM_MCPASK_CONFIG_DIMENSIONS="Embedding dimensions"
COM_MCPASK_CONFIG_DIMENSIONS_DESC="Fewer dimensions make searching faster and the index smaller. 0 uses the model's own size."
COM_MCPASK_CONFIG_API_BASE="Service address"
COM_MCPASK_CONFIG_API_BASE_DESC="Only change this for a service that is compatible with the OpenAI API."
COM_MCPASK_CONFIG_API_STYLE="Answer API"
COM_MCPASK_CONFIG_API_STYLE_DESC="OpenAI offers both. Most compatible services only offer Chat Completions."

COM_MCPASK_CONFIG_CONTENT="Content"
COM_MCPASK_CONFIG_CONTENT_DESC="Only published content that visitors who are not signed in may read is ever indexed."
COM_MCPASK_CONFIG_CATEGORIES="Limit to categories"
COM_MCPASK_CONFIG_CATEGORIES_DESC="Leave empty for all categories. Categories below a chosen one are included."
COM_MCPASK_CONFIG_FIELDS="Include custom fields"
COM_MCPASK_CONFIG_FIELDS_DESC="Text fields that visitors may see are read together with the body."
COM_MCPASK_CONFIG_FIELDS_ONLY="Only these fields"
COM_MCPASK_CONFIG_FIELDS_ONLY_DESC="Optional. Choose the custom fields to read; all other fields are ignored. Leave empty to read every text field visitors may see. The list shows FLEXIcontent's text fields when FLEXIcontent is installed, and Joomla's own otherwise. Use this when a field is public but not actually shown on the page, which FLEXIcontent decides in its templates."
COM_MCPASK_CONFIG_FIELDS_ONLY_HINT="All text fields visitors may see"
COM_MCPASK_CONFIG_ON_SAVE="Index when content is saved"
COM_MCPASK_CONFIG_ON_SAVE_DESC="When off, saved content waits for the scheduled task. Unpublished and deleted content always leaves the index at once."
COM_MCPASK_CONFIG_CHUNK="Passage size (tokens)"
COM_MCPASK_CONFIG_CHUNK_DESC="Pages are cut into passages of about this size. Smaller passages are found more precisely; larger ones keep more context."

COM_MCPASK_CONFIG_SITES="Other sites"
COM_MCPASK_CONFIG_SITES_DESC="Answer from the public content of other sites that run this extension, and let them answer from this site's. Each site reads the others on its scheduled task."
COM_MCPASK_CONFIG_PEERS="Sites to read"
COM_MCPASK_CONFIG_PEERS_DESC="For each site: its address, and the export key set in that site's options. Their pages are stored here with the address they have there, and are shown as sources with the site's name."
COM_MCPASK_CONFIG_PEER_NAME="Name"
COM_MCPASK_CONFIG_PEER_NAME_HINT="Shown with its sources"
COM_MCPASK_CONFIG_PEER_URL="Address"
COM_MCPASK_CONFIG_PEER_KEY="Its export key"
COM_MCPASK_CONFIG_EXPORT_KEY="This site's export key"
COM_MCPASK_CONFIG_EXPORT_KEY_DESC="Use Generate for a random key, save, and copy it into the options of the sites that are to read this one. A key of fewer than 24 characters is ignored. Sites that hold it can read this site's index: the passages and embeddings of the pages visitors who are not signed in may read. Leave empty to offer nothing."

COM_MCPASK_CONFIG_ANSWER="Answers"
COM_MCPASK_CONFIG_TOP_K="Passages per answer"
COM_MCPASK_CONFIG_TOP_K_DESC="How many of the best matching passages the model is given."
COM_MCPASK_CONFIG_STEPS="Further research steps"
COM_MCPASK_CONFIG_STEPS_DESC="How many times the model may search again or read a whole page before it answers, when it judges the first passages are not enough. More steps give fuller answers, and cost more time and tokens. 0 answers from the first passages alone."
COM_MCPASK_CONFIG_PAGE_CONTEXT="Take the current page into account"
COM_MCPASK_CONFIG_PAGE_CONTEXT_DESC="A question asked from an article is understood with that article in mind: \"how much is it?\" on a product page is about that product. Part of the passages are searched for with the page's title, the page itself is always among the sources, and the model is told where the visitor is. A question that names its own subject is not affected."
COM_MCPASK_CONFIG_MIN_SCORE="Minimum similarity"
COM_MCPASK_CONFIG_MIN_SCORE_DESC="Passages less similar to the question than this (0 to 1) are not used. When none is left, the visitor is told nothing was found and the model is not called."
COM_MCPASK_CONFIG_INSTRUCTIONS="Additional guidance"
COM_MCPASK_CONFIG_INSTRUCTIONS_DESC="Optional. For example the tone of voice, or where to send visitors when nothing is found."

COM_MCPASK_CONFIG_LIMITS="Limits and log"
COM_MCPASK_CONFIG_LIMITS_DESC="Anyone can ask, and every question costs money. These limits cap what one visitor and the whole site can spend."
COM_MCPASK_CONFIG_PER_MINUTE="Questions per minute, per visitor"
COM_MCPASK_CONFIG_PER_MINUTE_DESC="Counted by network address."
COM_MCPASK_CONFIG_PER_DAY="Questions per day, per visitor"
COM_MCPASK_CONFIG_PER_DAY_DESC="Counted by network address."
COM_MCPASK_CONFIG_SITE_PER_DAY="Questions per day, whole site"
COM_MCPASK_CONFIG_SITE_PER_DAY_DESC="When this is reached, nobody can ask until the oldest questions are a day old."
COM_MCPASK_CONFIG_BLOCK_PROBES="Turn probes away"
COM_MCPASK_CONFIG_BLOCK_PROBES_DESC="Text that is a test for weaknesses rather than a question (HTML tags, scripts, database statements, server commands, file paths, a bare web address, a sum) is not answered: nothing is sent to the AI service, so it costs nothing. Switch off for a site whose visitors really ask about such things, such as how to write an HTML tag."
COM_MCPASK_CONFIG_BLOCKED_WORDS="Blocked words"
COM_MCPASK_CONFIG_BLOCKED_WORDS_DESC="One per line. A question that contains one of them is not answered. A line between slashes is a regular expression, for example /\\bcasino\\b/i."
COM_MCPASK_CONFIG_STRIKES="Shut out after this many"
COM_MCPASK_CONFIG_STRIKES_DESC="An address whose questions were turned away this often within an hour gets no further answers for the rest of that hour. 0 never shuts anyone out."
COM_MCPASK_CONFIG_BLOCKED_IPS="Blocked addresses"
COM_MCPASK_CONFIG_BLOCKED_IPS_DESC="One per line: an address (203.0.113.7), a range (203.0.113.1-203.0.113.50) or a network (203.0.113.0/24, 2001:db8::/32). They get no answer and are not recorded. The button \"Block this address\" in the list of questions adds an address here."
COM_MCPASK_CONFIG_LOG_QUESTIONS="Record questions"
COM_MCPASK_CONFIG_LOG_QUESTIONS_DESC="Shows what visitors ask on the dashboard and in the module \"MCP - Questions Asked\"."
COM_MCPASK_CONFIG_LOG_WHO="Record who asked"
COM_MCPASK_CONFIG_LOG_WHO_DESC="Records the account of a visitor who is signed in, and the network address of everyone, and shows them with the questions. They are kept as long as the log is. Mention it in your privacy policy. When off, only a hash of the address is kept, for one day, to count the limits."
COM_MCPASK_CONFIG_LOG_DAYS="Keep the log (days)"
COM_MCPASK_CONFIG_LOG_DAYS_DESC="Older entries are deleted."
COM_MCPASK_CONFIG_WEBSITES="Websites by feed or sitemap"
COM_MCPASK_CONFIG_WEBSITES_DESC="Other public websites you know and trust. Give the address of an RSS or Atom feed, a sitemap.xml, or just the home page: its sitemap is then looked for (robots.txt and the usual places), and when there is none its links are followed, as many links deep as the crawl depth allows. Only pages on the same site are read, robots.txt and robots meta tags are respected, and sign-in, account, basket and search pages are skipped. Their text is answered from like your own, so list only sites whose content you vouch for. Reading and indexing pages uses embedding tokens."
COM_MCPASK_CONFIG_WEBSITE_NAME="Site name"
COM_MCPASK_CONFIG_WEBSITE_URL="Address (feed, sitemap or home page)"
COM_MCPASK_CONFIG_WEBSITE_SELECTOR="Content selector (optional)"
COM_MCPASK_CONFIG_WEBSITE_LIMIT="Most pages"
COM_MCPASK_WEBSITES="Websites by feed or sitemap"
COM_MCPASK_WEBSITES_NONE="No websites are listed. Add them under Options › Other sites."
COM_MCPASK_WEBSITES_SYNC="Read websites now"
COM_MCPASK_WEBSITES_REMAINING="%d pages still to read; they are read on the next run."
COM_MCPASK_WEBSITES_NOTE="The scheduled task “Ask the Site - Synchronise the index” also keeps these websites up to date."
COM_MCPASK_WEBSITE_ERROR_LIST="%1$s: the feed or sitemap could not be read (HTTP %2$d)."
COM_MCPASK_WEBSITE_ERROR_FORMAT="%s: the address is neither an RSS/Atom feed nor a sitemap."
COM_MCPASK_WEBSITE_ERROR_EMPTY="%s: the list has no pages of the site; what was stored is kept."
COM_MCPASK_CONFIG_EASYBLOG="Include EasyBlog posts"
COM_MCPASK_CONFIG_EASYBLOG_DESC="When EasyBlog is installed, its posts are answered from as well: only those everyone may read (published, public, no password or log in to read, in a public category, and for team blogs a team open to everyone). New and changed posts are picked up by the scheduled task and the synchronise button."
COM_MCPASK_INDEX_DESC_EASYBLOG="Also %d EasyBlog posts that everyone may read."
COM_MCPASK_CONFIG_WEBSITE_DEPTH="Crawl depth"
COM_MCPASK_ACTION_ASK="Ask questions"
COM_MCPASK_ACTION_ASK_DESC="Allows users in the group to ask the site questions. Allowed for Public by default. To let only signed-in users ask, set Public to &quot;Not Set&quot; and allow Registered (denying the Guest group also works where it is a group of its own, but on some sites it is Public itself)."
COM_MCPASK_ACTION_UNLIMITED="Ask without limits"
COM_MCPASK_ACTION_UNLIMITED_DESC="Users in the group are not held to the limits per minute, per day, or for the whole site. Super Users always are."
COM_MCPASK_CONFIG_GROUP_LIMITS="Limits by user group"
COM_MCPASK_CONFIG_GROUP_LIMITS_DESC="Other limits for some user groups, for example more questions for signed-in members. A visitor gets the most generous limit of the groups they are in (0 means no limit); groups not listed have the limits above. Guests are in Public and in the guest group. Signed-in users are counted by account when who asked is recorded, otherwise by address. Who may ask at all, and who is not limited, is set on the Permissions tab."
COM_MCPASK_CONFIG_GROUP_LIMIT_GROUP="User group"
