COM_MCPASK_SUBMENU_DASHBOARD="Dashboard"
COM_MCPASK_SUBMENU_QUALITY="Answer quality"
COM_MCPASK_QUALITY_GOOD="rated helpful (last %d days)"
COM_MCPASK_QUALITY_BAD="rated not helpful (last %d days)"
COM_MCPASK_QUALITY_ANSWERED="questions answered (last %d days)"
COM_MCPASK_QUALITY_SHARE="%1$s%% of the %2$s rated answers were found helpful."
COM_MCPASK_QUALITY_PENDING="Questions to look at (last %d days)"
COM_MCPASK_QUALITY_PENDING_DESC="Questions rated not helpful, and questions the site found nothing for or could not answer; the same question once, the worst first. Point them to the pages that answer them, or write the missing page."
COM_MCPASK_QUALITY_PENDING_NONE="Nothing to look at: no question was rated not helpful or went unanswered."
COM_MCPASK_QUALITY_ASKED="asked %d times"
COM_MCPASK_QUALITY_EMPTY="nothing found %d times"
COM_MCPASK_QUALITY_ERRORS="%d errors"
COM_MCPASK_RULE_FOR="Point to pages"
COM_MCPASK_RULE_EDITOR="Source rule"
COM_MCPASK_RULE_EDITOR_DESC="When a visitor asks something that means much the same as this question, the chosen pages are put first among what the answer is written from, and the note is passed on as your guidance. Other wording of the same question counts too."
COM_MCPASK_RULE_QUESTION="Question"
COM_MCPASK_RULE_PAGES="Pages to answer from"
COM_MCPASK_RULE_SEARCH="Search indexed pages by title…"
COM_MCPASK_RULE_NOTE="Note for the answer (optional)"
COM_MCPASK_RULE_NOTE_HINT="For example: Mention Vital BizForm first, then Vital OD for official documents."
COM_MCPASK_RULE_TRY="Try the question"
COM_MCPASK_RULE_SAVED="Saved."
COM_MCPASK_RULE_DELETE_CONFIRM="Delete this rule?"
COM_MCPASK_RULE_NEEDS="A rule needs a question and at least one page or a note."
COM_MCPASK_RULE_TRYING="Asking… (with the rules as saved)"
COM_MCPASK_RULE_TRY_HINTS="Rules that applied: 「%s」"
COM_MCPASK_RULE_TRY_NO_HINT="No rule applied to this question (save the rule first, or word the question closer to it)."
COM_MCPASK_RULE_TRY_NOTHING="Nothing was found for this question."
COM_MCPASK_RULE_NO_PAGES="No pages chosen."
COM_MCPASK_RULE_ADD="Add"
COM_MCPASK_RULE_REMOVE="Remove"
COM_MCPASK_RULE_SEARCH_NONE="No indexed page has these words in its title."
COM_MCPASK_RULES="Source rules (%d)"
COM_MCPASK_RULES_NONE="No rules yet. Choose "Point to pages" next to a question above, or write a question in the form."
COM_MCPASK_RULE_HITS="Used"
COM_MCPASK_RULE_PAGE_MISSING="no longer public"
COM_MCPASK_RULE_APPLIED="Rule applied"
COM_MCPASK_RATED_GOOD="Rated helpful"
COM_MCPASK_RATED_BAD="Rated not helpful"
COM_MCPASK_CONFIG_HINT_SCORE="Source rules: closeness"
COM_MCPASK_CONFIG_HINT_SCORE_DESC="How close in meaning (0.3 to 0.95) a question must be to the question of a source rule, or one of its other wordings, for the rule to apply. At 0.5 the same question in other words usually applies, a question about another product does not. Raise it if rules apply too widely; add other wordings to a rule rather than lowering it."
COM_MCPASK_RULE_VARIANTS="Other wordings (optional, one per line)"
COM_MCPASK_RULE_VARIANTS_HINT="For example: Do you have an e-signature tool?"
COM_MCPASK_RULE_SAVE="Save rule"
COM_MCPASK_RULE_EDIT="Edit"
COM_MCPASK_RULE_DELETE="Delete"
COM_MCPASK_CONFIG_FALLBACK="Backup service"
COM_MCPASK_CONFIG_FALLBACK_DESC="When the AI service above is down (HTTP 5xx, 429, a timeout or no connection), answer with this one instead, for example OpenAI itself when the main service is Open WebUI. It never steps in once part of an answer has been shown, and a refused request (a wrong key, an unknown model) is not hidden behind it. After a failure everyone goes straight to the backup for a minute. The question log notes each answer it gave."
COM_MCPASK_CONFIG_FALLBACK_BASE="Backup service address"
COM_MCPASK_CONFIG_FALLBACK_KEY="Backup API key"
COM_MCPASK_CONFIG_FALLBACK_MODEL="Backup chat model"
COM_MCPASK_CONFIG_FALLBACK_MODEL_DESC="The model name as the backup service knows it, which may differ from the main service’s. It must work with the API format chosen above."
COM_MCPASK_CONFIG_FALLBACK_EMBEDDINGS="Backup for embeddings too"
COM_MCPASK_CONFIG_FALLBACK_EMBEDDINGS_DESC="Only switch this on when the backup offers exactly the same embedding model (name and size) as the main service, such as OpenAI’s text-embedding-3-small behind both. Vectors of another model do not compare with the index, and searches would quietly find the wrong pages. Without it, a question still fails while the main service cannot make its embedding."
COM_MCPASK_CHECK_FALLBACK_READY="A backup AI service is ready; it has not been needed in the last day."
COM_MCPASK_CHECK_FALLBACK_USED="The backup AI service had to answer, last at %1$s, because the main service failed: %2$s"
COM_MCPASK_CONFIG_FALLBACK_STYLE="Backup answer API"
COM_MCPASK_CONFIG_FALLBACK_STYLE_DESC="The API format of the backup service, which may differ from the main one’s: the Responses API for OpenAI itself, Chat Completions for most compatible services such as Open WebUI."
COM_MCPASK_CONFIG_TRUSTED_PROXIES="Trusted proxies"
COM_MCPASK_CONFIG_TRUSTED_PROXIES_DESC="When the site runs behind a reverse proxy or load balancer, its addresses, one per line (ranges like 10.0.0.0/8 allowed). Only then is X-Forwarded-For believed, and only its right-most entry that is not one of these. Left empty, the address Joomla reports is used; if "Behind Load Balancer" is on in the Global Configuration, a visitor can then claim any address and get round the limits per visitor."
COM_MCPASK_ASKED_BY_MEMBER="Member"
COM_MCPASK_ACTION_EDIT_DESC="Create and change source rules, and try questions (which uses the AI service)."
COM_MCPASK_ACTION_DELETE_DESC="Delete source rules."
COM_MCPASK_FLAGS_FILTER="Show questions"
COM_MCPASK_FLAGS_ALL="All"
COM_MCPASK_FLAG_INJECTION_SUSPECT="Injection attempt?"
COM_MCPASK_FLAG_HTML_PAYLOAD="HTML / script"
COM_MCPASK_FLAG_OUTPUT_FILTERED="Answer filtered"
COM_MCPASK_ANSWER_SHOWN="Answer"
COM_MCPASK_ANSWER_RAW="As the model wrote it (before filtering)"
COM_MCPASK_CONFIG_ALLOWED_HOSTS="Sites answers may link to"
COM_MCPASK_CONFIG_ALLOWED_HOSTS_DESC="One per line: example.com, or *.example.com for every site below it. Besides these, answers may only link to this site and to the sites of the pages they were written from; other links are removed before the visitor sees them, and so are phone numbers, e-mail addresses and LINE IDs the pages do not give."
COM_MCPASK_CONFIG_INJECTION_PATTERNS="Phrases of injection attempts"
COM_MCPASK_CONFIG_INJECTION_PATTERNS_DESC="One per line; a line between slashes is a regular expression. A question containing one is marked "Injection attempt?" in the log, and any text it asks to be repeated is kept out of the answer. Left empty, the list that comes with the extension is used."
COM_MCPASK_CONFIG_HOWTO_TEMPLATE="How-to answers"
COM_MCPASK_CONFIG_HOWTO_TEMPLATE_DESC="Rules for answering questions of how to do something, given to the model as they are (any model reads them). They apply when the question uses one of the how-to words below, or when the pages found are step-by-step guides (pages with headings "步驟 1：" or "Step 1:"); then the whole guide is given, in its order. Empty switches it off."
COM_MCPASK_CONFIG_HOWTO_WORDS="How-to words"
COM_MCPASK_CONFIG_HOWTO_WORDS_DESC="One per line. A question containing one is answered as a how-to question. Left empty, the list that comes with the extension is used."

COM_MCPASK_APPEARANCE="Appearance"
COM_MCPASK_THEME_DESCRIBE="Describe the look you want"
COM_MCPASK_THEME_DESCRIBE_HINT="For example: calm dark blue, businesslike; or a change: \"make the buttons orange\""
COM_MCPASK_THEME_NO_AI="The AI service is not set up, so colours cannot be made from a description; they can still be chosen one by one below."
