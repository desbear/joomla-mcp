COM_MCPASK_RULES="指定來源規則（%d）"
COM_MCPASK_RULES_NONE="還沒有規則。可以在上方待處理的提問旁按「指定來源」，或直接在表單輸入問題。"
COM_MCPASK_RULE_HITS="套用次數"
