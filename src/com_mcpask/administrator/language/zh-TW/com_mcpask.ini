COM_MCPASK_PEERS_EXPORT_OFF="本站目前不提供索引給其他網站。要開放的話，請到「選項」設定至少 24 個字元的匯出金鑰。"
COM_MCPASK_PEERS_EXPORT_SHORT="本站的匯出金鑰太短，目前視為未設定，其他網站無法讀取本站。請改用至少 24 個字元的金鑰，最好是隨機產生的。"
COM_MCPASK_PEERS_NONE="目前沒有讀取任何其他網站。到「選項 → 其他網站」新增後，回答就能一併取材自它們的公開內容。"
COM_MCPASK_PEERS_SITE="網站"
