COM_MCPASK_REPORT_DIMENSION_NAME="名稱"
COM_MCPASK_REPORT_DIMENSION_DESC="說明"
COM_MCPASK_REPORT_SECTIONS="段落"
COM_MCPASK_REPORT_SECTIONS_DESC="依序撰寫，每段一個主題。"
COM_MCPASK_REPORT_SECTION_TITLE="標題"
COM_MCPASK_REPORT_SECTION_BRIEF="這一段要寫什麼"
COM_MCPASK_REPORT_SECTION_BRIEF_DESC="給 AI 的說明，例如「依剛剛的回答分析現況與痛點，說明原因」。"
