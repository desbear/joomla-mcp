COM_MCPASK_AGENT_DELETE_CONFIRM="確定刪除選取的 Agent？它的對話紀錄與統計也會一起刪除。"
COM_MCPASK_AGENT_TALK="對話"
COM_MCPASK_AGENT_OPENING="開場白"
COM_MCPASK_AGENT_OPENING_DESC="接手時說的第一句話。留空使用這種 Agent 預設的開場白。可以使用 **粗體** 與清單。"
COM_MCPASK_AGENT_DONE="完成訊息"
COM_MCPASK_AGENT_DONE_DESC="完成時顯示的訊息。留空使用預設（RSForm 表單：表單本身的感謝訊息）。"
COM_MCPASK_AGENT_TRIGGERS="觸發方式"
COM_MCPASK_AGENT_TRIGGERS_DESC="可以同時使用多種：打開問答時推薦、問題接近觸發問句時在回答下方推薦、或讓 AI 判斷要不要推薦。"
COM_MCPASK_AGENT_SUGGEST="開窗推薦"
COM_MCPASK_AGENT_SUGGEST_DESC="打開問答、還沒有對話時，列出這個 Agent 讓訪客點選。"
COM_MCPASK_AGENT_SUGGEST_LABEL="推薦按鈕文字"
COM_MCPASK_AGENT_SUGGEST_LABEL_DESC="例如「幫我評估需要哪些數位轉型工具」。留空使用名稱。"
COM_MCPASK_AGENT_PHRASES="觸發問句"
COM_MCPASK_AGENT_PHRASES_DESC="一行一句。訪客的問題和其中一句意思相近時，在回答下方推薦這個 Agent。"
COM_MCPASK_AGENT_PHRASE_SCORE="相近程度門檻"
COM_MCPASK_AGENT_PHRASE_SCORE_DESC="0.3–0.95，越高越嚴格。預設 0.6。"
COM_MCPASK_AGENT_AI_OFFER="AI 判斷推薦"
COM_MCPASK_AGENT_AI_OFFER_DESC="讓回答問題的 AI 自行判斷，這個問題是否適合推薦這個 Agent。需要在選項中開啟「AI 可以再搜尋」。"
COM_MCPASK_AGENT_AI_HINT="給 AI 的說明"
COM_MCPASK_AGENT_AI_HINT_DESC="這個 Agent 能幫訪客做什麼、什麼情況適合推薦，例如「幫訪客評估適合的數位轉型工具，適合在比較方案或問哪個產品適合時推薦」。"
COM_MCPASK_AGENT_OFFER_TEXT="推薦說明"
COM_MCPASK_AGENT_OFFER_TEXT_DESC="在回答下方推薦時顯示的一句話，例如「要不要花兩分鐘，讓我幫你評估適合的方案？」"
COM_MCPASK_AGENT_OFFER_BUTTON="推薦按鈕文字"
COM_MCPASK_AGENT_SCOPE="適用範圍"
COM_MCPASK_AGENT_LANGUAGES="語言"
COM_MCPASK_AGENT_LANGUAGES_DESC="只在這些語言的頁面出現；留空為所有語言。"
COM_MCPASK_AGENT_ACCESS_DESC="可以使用這個 Agent 的存取層級。"
COM_MCPASK_AGENT_PER_DAY="每位訪客每天"
COM_MCPASK_AGENT_PER_DAY_DESC="同一位訪客每天最多可以開始幾次。"

COM_MCPASK_AGENT_REPORT="分析報告"
COM_MCPASK_AGENT_REPORT_DESC="完成後依訪客的回答，加上下方分類的網站內容，寫一份分段、可配圖的分析報告。報告逐段出現在對話中，也有專屬網址，並可寄到訪客填寫的 Email。"
COM_MCPASK_REPORT_ON="撰寫分析報告"
COM_MCPASK_REPORT_ON_DESC="送出後為訪客寫一份分析報告。"
COM_MCPASK_REPORT_TITLE="報告標題"
COM_MCPASK_REPORT_TITLE_DESC="{type} 會換成訪客的類型名稱。"
COM_MCPASK_REPORT_INTRO="開頭說明"
COM_MCPASK_REPORT_INTRO_DESC="放在報告最前面的一段話（選填）。"
COM_MCPASK_REPORT_TYPES="結果類型"
COM_MCPASK_REPORT_TYPES_DESC="像心理測驗的結果：AI 依回答判斷訪客屬於哪一型。每一型有名稱、說明、代表色與代表圖。"
COM_MCPASK_REPORT_TYPE_NAME="名稱"
