COM_MCPASK_PEER_ERROR_404="「%1$s」沒有提供任何內容。請到該站的選項確認：它自己的匯出金鑰至少有 %2$d 個字元、「回答問題」已開啟、網站不是離線狀態，而且安裝的是 0.2.0 以上的版本。"
