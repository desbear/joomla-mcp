COM_MCPASK_RATED_GOOD="訪客評為有幫助"
COM_MCPASK_RATED_BAD="訪客評為沒有幫助"
COM_MCPASK_CONFIG_HINT_SCORE="指定來源：相近程度"
COM_MCPASK_CONFIG_HINT_SCORE_DESC="訪客的問題要和規則的問題（或其他問法）多接近（0.3～0.95）才套用規則。0.5 時，同一個問題換個說法通常會套用，問別的產品則不會。如果規則套用得太廣就調高；想讓更多問法套用，建議在規則中加入「其他問法」，而不是調低這個值。"
COM_MCPASK_RULE_VARIANTS="其他問法（選填，一行一個）"
COM_MCPASK_RULE_VARIANTS_HINT="例如：有沒有電子簽核的工具？"
COM_MCPASK_RULE_SAVE="儲存規則"
COM_MCPASK_RULE_EDIT="編輯"
COM_MCPASK_RULE_DELETE="刪除"
COM_MCPASK_CONFIG_FALLBACK="備援 AI 服務"
COM_MCPASK_CONFIG_FALLBACK_DESC="上方的 AI 服務故障時（HTTP 5xx、429、逾時或連不上），改用這個服務回答，例如主要服務是 Open WebUI 時改用 OpenAI。回答已經開始顯示時不會切換；被拒絕的請求（金鑰錯誤、模型不存在）也不會被備援掩蓋。主要服務失敗後的 1 分鐘內，所有提問直接使用備援。每次由備援回答都會記錄在提問紀錄中。"
COM_MCPASK_CONFIG_FALLBACK_BASE="備援服務網址"
COM_MCPASK_CONFIG_FALLBACK_KEY="備援 API 金鑰"
COM_MCPASK_CONFIG_FALLBACK_MODEL="備援對話模型"
COM_MCPASK_CONFIG_FALLBACK_MODEL_DESC="備援服務認得的模型名稱，可以和主要服務不同；需支援上方選擇的 API 格式。"
COM_MCPASK_CONFIG_FALLBACK_EMBEDDINGS="Embedding 也使用備援"
COM_MCPASK_CONFIG_FALLBACK_EMBEDDINGS_DESC="只有在備援服務提供「完全相同」的 embedding 模型（名稱與維度）時才開啟，例如兩邊背後都是 OpenAI 的 text-embedding-3-small。不同模型產生的向量無法和索引比對，搜尋會悄悄找到錯的頁面。不開啟時，主要服務無法產生問題的 embedding 時，該次提問仍會失敗。"
COM_MCPASK_CHECK_FALLBACK_READY="已設定備援 AI 服務，過去一天沒有用到。"
COM_MCPASK_CHECK_FALLBACK_USED="過去一天曾改由備援 AI 服務回答，最近一次在 %1$s，主要服務的錯誤：%2$s"
COM_MCPASK_CONFIG_FALLBACK_STYLE="備援回答 API"
COM_MCPASK_CONFIG_FALLBACK_STYLE_DESC="備援服務使用的 API 格式，可以和主要服務不同：直接用 OpenAI 時選 Responses API；Open WebUI 等相容服務多半選 Chat Completions。"
COM_MCPASK_CONFIG_TRUSTED_PROXIES="可信任的反向代理"
COM_MCPASK_CONFIG_TRUSTED_PROXIES_DESC="網站在反向代理或負載平衡器後面時，填入它們的位址，一行一個（可用 10.0.0.0/8 這類範圍）。只有請求來自這些位址時，才會採信 X-Forwarded-For，而且只取最右邊不屬於這些代理的那一個。留白則使用 Joomla 回報的位址；若全域設定開啟了「Behind Load Balancer」，訪客就能自稱任何位址，繞過每位訪客的提問限制。"
COM_MCPASK_ASKED_BY_MEMBER="會員"
COM_MCPASK_ACTION_EDIT_DESC="新增與修改指定來源規則，以及試問（會使用 AI 服務）。"
COM_MCPASK_ACTION_DELETE_DESC="刪除指定來源規則。"
COM_MCPASK_FLAGS_FILTER="顯示提問"
COM_MCPASK_FLAGS_ALL="全部"
COM_MCPASK_FLAG_INJECTION_SUSPECT="疑似注入"
COM_MCPASK_FLAG_HTML_PAYLOAD="HTML／指令碼"
COM_MCPASK_FLAG_OUTPUT_FILTERED="回答已過濾"
COM_MCPASK_ANSWER_SHOWN="回答"
COM_MCPASK_ANSWER_RAW="模型原始回答（過濾前）"
COM_MCPASK_CONFIG_ALLOWED_HOSTS="回答可連結的網域"
COM_MCPASK_CONFIG_ALLOWED_HOSTS_DESC="一行一個：example.com，或用 *.example.com 涵蓋所有子網域。除了這些網域，回答只能連到本站以及回答所根據頁面的網站；其他連結會在訪客看到之前移除，來源頁面沒有出現的電話、Email、LINE ID 也會一併移除。"
COM_MCPASK_CONFIG_INJECTION_PATTERNS="注入攻擊的常見說法"
COM_MCPASK_CONFIG_INJECTION_PATTERNS_DESC="一行一個；前後加斜線的是正規表示式。提問含有其中任一項時，提問紀錄會標記「疑似注入」，提問要求照抄的文字也不會出現在回答中。留白則使用擴充套件內建的清單。"
COM_MCPASK_CONFIG_HOWTO_TEMPLATE="操作教學回答樣板"
COM_MCPASK_CONFIG_HOWTO_TEMPLATE_DESC="回答「如何操作」類問題的規則，會原樣交給 AI（任何模型都能讀）。提問含下方的操作類用語，或找到的頁面是步驟教學（有「步驟 1：」或「Step 1:」標題的頁面）時套用；後者會把整份教學依原本順序交給 AI。留白即關閉。"
COM_MCPASK_CONFIG_HOWTO_WORDS="操作類用語"
COM_MCPASK_CONFIG_HOWTO_WORDS_DESC="一行一個。提問含其中任一項時，以操作教學的方式回答。留白則使用內建清單。"

