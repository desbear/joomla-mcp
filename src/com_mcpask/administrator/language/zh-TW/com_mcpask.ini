COM_MCPASK_CONFIG_SERVICE="AI 服務"
COM_MCPASK_CONFIG_SERVICE_DESC="使用的金鑰與模型。更換向量模型或維度後，必須重新同步索引。"
COM_MCPASK_CONFIG_ENABLED="回答問題"
COM_MCPASK_CONFIG_ENABLED_DESC="關閉後停止回答，不需要取消發佈模組。"
COM_MCPASK_CONFIG_ACCESS="誰可以提問"
COM_MCPASK_CONFIG_ACCESS_DESC="訪客需要具備的存取層級才能提問，模組請設定相同的存取層級。不論誰提問，回答一律只取材自公開內容。"
COM_MCPASK_CONFIG_API_KEY="API 金鑰"
COM_MCPASK_CONFIG_API_KEY_DESC="OpenAI 的 API 金鑰。只會留在這台伺服器上，不會傳給訪客。"
COM_MCPASK_CONFIG_CHAT_MODEL="回答模型"
COM_MCPASK_CONFIG_CHAT_MODEL_DESC="負責撰寫回答的模型。通常選小型、快速的模型即可。"
COM_MCPASK_CONFIG_REASONING="推理強度"
COM_MCPASK_CONFIG_REASONING_DESC="只適用於推理模型，強度越低，回答越快開始出現。若模型不支援推理，會自動改為不帶此設定重送。"
COM_MCPASK_CONFIG_REASONING_NONE="不傳送"
COM_MCPASK_CONFIG_MAX_OUTPUT="回答長度上限（token）"
COM_MCPASK_CONFIG_MAX_OUTPUT_DESC="單次回答的長度上限。"
COM_MCPASK_CONFIG_EMBEDDING_MODEL="向量模型"
COM_MCPASK_CONFIG_EMBEDDING_MODEL_DESC="把文字轉成向量、用來搜尋的模型。"
COM_MCPASK_CONFIG_DIMENSIONS="向量維度"
COM_MCPASK_CONFIG_DIMENSIONS_DESC="維度越少，搜尋越快、索引越小。填 0 則使用模型本身的維度。"
COM_MCPASK_CONFIG_API_BASE="服務網址"
COM_MCPASK_CONFIG_API_BASE_DESC="只有在使用與 OpenAI API 相容的其他服務時才需要修改。"
COM_MCPASK_CONFIG_API_STYLE="回答 API"
COM_MCPASK_CONFIG_API_STYLE_DESC="OpenAI 兩種都支援；多數相容服務只提供 Chat Completions。"

COM_MCPASK_CONFIG_CONTENT="內容"
COM_MCPASK_CONFIG_CONTENT_DESC="只有已發佈、且未登入訪客可閱讀的內容才會建立索引。"
COM_MCPASK_CONFIG_CATEGORIES="限定分類"
COM_MCPASK_CONFIG_CATEGORIES_DESC="留白表示全部分類。選取的分類包含其下層分類。"
COM_MCPASK_CONFIG_FIELDS="包含自訂欄位"
COM_MCPASK_CONFIG_FIELDS_DESC="訪客可見的文字欄位會和內文一起讀取。"
COM_MCPASK_CONFIG_FIELDS_ONLY="只讀取這些欄位"
COM_MCPASK_CONFIG_FIELDS_ONLY_DESC="選填。選擇要讀取的自訂欄位，其餘欄位一律略過；留白則讀取所有訪客可見的文字欄位。網站裝有 FLEXIcontent 時列出的是 FLEXIcontent 的文字欄位，否則是 Joomla 原生的自訂欄位。當某個欄位雖然設為公開、但實際上沒有顯示在頁面上時請使用（FLEXIcontent 是由各類型的版型決定欄位是否顯示）。"
COM_MCPASK_CONFIG_FIELDS_ONLY_HINT="所有訪客可見的文字欄位"
COM_MCPASK_CONFIG_ON_SAVE="存檔時建立索引"
COM_MCPASK_CONFIG_ON_SAVE_DESC="關閉後，存檔的內容會等排程工作處理。取消發佈與刪除的內容一律立即從索引移除。"
COM_MCPASK_CONFIG_CHUNK="段落大小（token）"
COM_MCPASK_CONFIG_CHUNK_DESC="頁面會切成大約這個大小的段落。段落小，搜尋較精準；段落大，保留較多上下文。"

COM_MCPASK_CONFIG_SITES="其他網站"
COM_MCPASK_CONFIG_SITES_DESC="讓回答一併取材自其他裝有本擴充的網站的公開內容，也讓它們取材自本站。各站會在自己的排程工作中讀取對方。"
COM_MCPASK_CONFIG_PEERS="要讀取的網站"
COM_MCPASK_CONFIG_PEERS_DESC="每個網站填入網址，以及對方在選項中設定的匯出金鑰。對方的頁面會連同它在原站的網址存到本站，作為來源顯示時會標上網站名稱。"
COM_MCPASK_CONFIG_PEER_NAME="名稱"
COM_MCPASK_CONFIG_PEER_NAME_HINT="顯示在來源卡片上"
COM_MCPASK_CONFIG_PEER_URL="網址"
COM_MCPASK_CONFIG_PEER_KEY="對方的匯出金鑰"
COM_MCPASK_CONFIG_EXPORT_KEY="本站的匯出金鑰"
COM_MCPASK_CONFIG_EXPORT_KEY_DESC="按「產生金鑰」取得一把隨機金鑰，儲存後複製到要讀取本站的網站的選項裡。少於 24 個字元的金鑰會被視為未設定。持有它的網站可以讀取本站的索引，也就是未登入訪客可閱讀的頁面的段落與向量。留白表示不提供。"

COM_MCPASK_CONFIG_ANSWER="回答"
COM_MCPASK_CONFIG_TOP_K="每次回答使用的段落數"
COM_MCPASK_CONFIG_TOP_K_DESC="把最相關的幾個段落交給模型。"
COM_MCPASK_CONFIG_STEPS="進一步查找的次數"
COM_MCPASK_CONFIG_STEPS_DESC="模型判斷最初找到的段落不足時，回答前最多可以再搜尋或閱讀完整頁面幾次。次數越多回答越完整，但花費的時間與 token 也越多。填 0 表示只依最初的段落回答。"
COM_MCPASK_CONFIG_PAGE_CONTEXT="參考訪客目前所在的頁面"
COM_MCPASK_CONFIG_PAGE_CONTEXT_DESC="訪客在某篇文章頁面提問時，會把那一頁當成理解問題的背景：在產品頁問「價格多少？」，就會當成是在問那個產品。做法是一部分段落改用頁面標題一起搜尋、那一頁本身一定列入來源，並告訴模型訪客正在看哪一頁。問題本身已經說明主題時不受影響。"
COM_MCPASK_CONFIG_MIN_SCORE="最低相似度"
COM_MCPASK_CONFIG_MIN_SCORE_DESC="與問題的相似度（0 到 1）低於此值的段落不會使用。若沒有任何段落達標，會直接告訴訪客找不到內容，不呼叫模型。"
COM_MCPASK_CONFIG_INSTRUCTIONS="補充指示"
COM_MCPASK_CONFIG_INSTRUCTIONS_DESC="選填。例如回答的語氣，或找不到內容時要引導訪客去哪裡。"

COM_MCPASK_CONFIG_LIMITS="限制與紀錄"
COM_MCPASK_CONFIG_LIMITS_DESC="任何人都能提問，而每個問題都有費用。這些限制控制單一訪客與整個網站的用量上限。"
COM_MCPASK_CONFIG_PER_MINUTE="每位訪客每分鐘的提問數"
COM_MCPASK_CONFIG_PER_MINUTE_DESC="以網路位址計算。"
COM_MCPASK_CONFIG_PER_DAY="每位訪客每天的提問數"
COM_MCPASK_CONFIG_PER_DAY_DESC="以網路位址計算。"
COM_MCPASK_CONFIG_SITE_PER_DAY="全站每天的提問數"
COM_MCPASK_CONFIG_SITE_PER_DAY_DESC="達到上限後，所有人都必須等最早的提問超過一天才能再問。"
COM_MCPASK_CONFIG_BLOCK_PROBES="阻擋探測內容"
COM_MCPASK_CONFIG_BLOCK_PROBES_DESC="不是提問、而是在測試弱點的文字（HTML 標籤、指令碼、資料庫語法、伺服器指令、檔案路徑、只有一個網址、只有算式）不會回答，也不會送到 AI 服務，因此不產生費用。如果您的訪客真的會問這類內容（例如怎麼寫某個 HTML 標籤），請關閉。"
COM_MCPASK_CONFIG_BLOCKED_WORDS="封鎖字詞"
COM_MCPASK_CONFIG_BLOCKED_WORDS_DESC="每行一個。問題中包含其中任何一個就不回答。前後用斜線包起來的那一行會當成正規表示式，例如 /\\bcasino\\b/i。"
COM_MCPASK_CONFIG_STRIKES="被擋幾次後暫時封鎖"
COM_MCPASK_CONFIG_STRIKES_DESC="同一個位址在一小時內被擋下這麼多次後，這一小時內就不再回答它的任何問題。填 0 表示不自動封鎖。"
COM_MCPASK_CONFIG_BLOCKED_IPS="封鎖的位址"
COM_MCPASK_CONFIG_BLOCKED_IPS_DESC="每行一個：單一位址（203.0.113.7）、範圍（203.0.113.1-203.0.113.50）或網段（203.0.113.0/24、2001:db8::/32）。這些位址不會得到回答，也不會留下紀錄。提問清單裡的「封鎖此位址」按鈕會把位址加到這裡。"
COM_MCPASK_CONFIG_LOG_QUESTIONS="記錄問題內容"
COM_MCPASK_CONFIG_LOG_QUESTIONS_DESC="在儀表板與「MCP - 訪客提問」模組顯示訪客問了什麼。"
COM_MCPASK_CONFIG_LOG_WHO="記錄提問者"
COM_MCPASK_CONFIG_LOG_WHO_DESC="記錄已登入訪客的帳號，以及每位提問者的網路位址，並和問題一起顯示。保留時間與紀錄相同，請在隱私權政策中說明。關閉時只會保留位址的雜湊值一天，用來計算提問上限。"
COM_MCPASK_CONFIG_LOG_DAYS="紀錄保留天數"
COM_MCPASK_CONFIG_LOG_DAYS_DESC="超過天數的紀錄會被刪除。"
COM_MCPASK_CONFIG_WEBSITES="外部網站（RSS／Sitemap）"
COM_MCPASK_CONFIG_WEBSITES_DESC="您認識且信任的其他公開網站。可以填 RSS／Atom 摘要、sitemap.xml，或直接填首頁：會先自動尋找網站的 Sitemap（robots.txt 與常見位置），找不到時再沿著頁面連結爬取，最多爬到「爬取深度」設定的層數。只讀取同網域頁面，遵守 robots.txt 與頁面的 robots 標記，並略過登入、帳號、購物車與搜尋頁。這些內容會和本站內容一樣被用來回答，請只加入您能為其內容負責的網站。讀取與索引頁面會消耗 embedding Token。"
COM_MCPASK_CONFIG_WEBSITE_NAME="網站名稱"
COM_MCPASK_CONFIG_WEBSITE_URL="網址（RSS、Sitemap 或首頁）"
COM_MCPASK_CONFIG_WEBSITE_SELECTOR="內文選擇器（選填）"
COM_MCPASK_CONFIG_WEBSITE_LIMIT="最多頁數"
COM_MCPASK_WEBSITES="外部網站（RSS／Sitemap）"
COM_MCPASK_WEBSITES_NONE="尚未設定外部網站，請到「選項 › 其他網站」分頁加入。"
COM_MCPASK_WEBSITES_SYNC="立即讀取外部網站"
COM_MCPASK_WEBSITES_REMAINING="還有 %d 頁待讀取，下次執行時會繼續。"
COM_MCPASK_WEBSITES_NOTE="排程工作「官網內容問答 - 同步索引」也會定期更新這些網站。"
COM_MCPASK_WEBSITE_ERROR_LIST="%1$s：無法讀取 RSS 或 Sitemap（HTTP %2$d）。"
COM_MCPASK_WEBSITE_ERROR_FORMAT="%s：這個網址不是 RSS／Atom 摘要，也不是 Sitemap。"
COM_MCPASK_WEBSITE_ERROR_EMPTY="%s：清單裡沒有這個網站的頁面，已保留原本的內容。"
COM_MCPASK_CONFIG_EASYBLOG="納入 EasyBlog 文章"
COM_MCPASK_CONFIG_EASYBLOG_DESC="安裝了 EasyBlog 時，一併使用它的文章回答。只納入所有人都能讀的文章：已發佈、公開、沒有密碼或「登入才能閱讀」、在公開分類中，團隊部落格則限開放所有人閱讀的團隊。新增或修改的文章會由排程工作與「同步索引」按鈕更新。"
COM_MCPASK_INDEX_DESC_EASYBLOG="另含所有人可讀的 EasyBlog 文章 %d 篇。"
COM_MCPASK_CONFIG_WEBSITE_DEPTH="爬取深度"
COM_MCPASK_ACTION_ASK="提問"
COM_MCPASK_ACTION_ASK_DESC="允許此群組的使用者向網站提問，預設 Public 為允許。若只想讓登入的會員提問：把 Public 改為「未設定」，再把 Registered 設為允許。（將 Guest 群組設為拒絕也可以，但有些網站的訪客群組就是 Public 本身，那樣會擋掉所有人。）"
COM_MCPASK_ACTION_UNLIMITED="不受提問次數限制"
COM_MCPASK_ACTION_UNLIMITED_DESC="此群組的使用者不受每分鐘、每天與全站每日提問次數的限制。超級管理員一律不受限制。"
COM_MCPASK_CONFIG_GROUP_LIMITS="依使用者群組的提問限制"
COM_MCPASK_CONFIG_GROUP_LIMITS_DESC="為特定使用者群組設定不同的限制，例如登入會員可以問更多次。使用者屬於多個群組時採用最寬鬆的限制（0 表示不限制）；未列出的群組沿用上方的限制。訪客屬於 Public 與訪客群組。啟用「記錄提問者」時，登入的使用者依帳號計算，否則依網路位址計算。誰可以提問、誰不受限制，請在「權限」分頁設定。"
COM_MCPASK_CONFIG_GROUP_LIMIT_GROUP="使用者群組"
COM_MCPASK_WEBSITES_SKIPPED="上次略過：%s"
COM_MCPASK_WEBSITES_SKIP_NO_TEXT="找不到內文"
COM_MCPASK_WEBSITES_SKIP_NO_CONNECTION="無法連線"
COM_MCPASK_WEBSITES_SKIP_ROBOTS="robots.txt 不允許"
COM_MCPASK_WEBSITES_STATE_DONE="已是最新"
COM_MCPASK_WEBSITES_STATE_RUNNING="讀取中"
COM_MCPASK_WEBSITES_STATE_PENDING="待續"
COM_MCPASK_WEBSITES_STATE_ERROR="錯誤"
COM_MCPASK_WEBSITES_STATE_NEW="尚未讀取"
COM_MCPASK_WEBSITES_MODE_FEED="RSS／Atom"
COM_MCPASK_WEBSITES_MODE_SITEMAP="Sitemap"
COM_MCPASK_WEBSITES_MODE_CRAWL="沿連結爬取"
COM_MCPASK_WEBSITES_PROGRESS_LINE="已處理 %s / %s 頁"
COM_MCPASK_WEBSITES_STORED="已索引 %s 頁"
