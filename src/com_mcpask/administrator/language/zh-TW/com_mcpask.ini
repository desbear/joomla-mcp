COM_MCPASK_REPORT_IMAGE_GENERATE="用 AI 即時產生"
COM_MCPASK_REPORT_SECTION_PROMPT="插圖提示詞"
COM_MCPASK_REPORT_SECTION_PROMPT_DESC="描述想要的畫面。{type} 換成類型名稱、{size} 換成回答中的規模；不會放入姓名、Email 等個人資料。相同提示詞只產生一次。"
COM_MCPASK_REPORT_SECTION_RECOMMEND="推薦方案"
COM_MCPASK_REPORT_SECTION_RECOMMEND_DESC="這一段從網站內容挑出適合的方案並引用來源。"
COM_MCPASK_REPORT_CATEGORIES="參考的分類"
COM_MCPASK_REPORT_CATEGORIES_DESC="只用這些分類（含子分類）的已索引內容撰寫報告；留空為全站。"
COM_MCPASK_REPORT_ACTIONS="結尾按鈕"
COM_MCPASK_REPORT_ACTIONS_DESC="報告最後的行動按鈕，例如「預約顧問諮詢」。網址填 #mcp-ask-handoff 會轉接真人客服（需要設定 LiveChat Agent）。"
COM_MCPASK_REPORT_ACTION_LABEL="文字"
COM_MCPASK_REPORT_ACTION_URL="網址"
COM_MCPASK_REPORT_IMAGES_PER_DAY="每天最多產生幾張圖"
COM_MCPASK_REPORT_IMAGES_PER_DAY_DESC="即時產生插圖的每日上限（全站）；超過時改用結果類型的代表圖。0 為不產生。"
