COM_MCPASK="官網內容問答"
COM_MCPASK_XML_DESCRIPTION="透過 OpenAI 依官網自己的內容回答訪客的問題，並標示每段回答來自哪些頁面。前台請搭配「MCP - 詢問官網內容」模組使用。"
COM_MCPASK_ACTION_ASK="提問"
COM_MCPASK_ACTION_ASK_DESC="允許此群組的使用者向網站提問，預設 Public 為允許。若只想讓登入的會員提問：把 Public 改為「未設定」，再把 Registered 設為允許。（將 Guest 群組設為拒絕也可以，但有些網站的訪客群組就是 Public 本身，那樣會擋掉所有人。）"
COM_MCPASK_ACTION_UNLIMITED="不受提問次數限制"
COM_MCPASK_ACTION_UNLIMITED_DESC="此群組的使用者不受每分鐘、每天與全站每日提問次數的限制。超級管理員一律不受限制。"
