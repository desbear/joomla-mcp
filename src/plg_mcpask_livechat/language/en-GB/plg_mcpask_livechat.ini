PLG_MCPASK_LIVECHAT="Ask the Site - LiveChat agent"
PLG_MCPASK_LIVECHAT_XML_DESCRIPTION="Lets Ask the Site pass visitors on to people in LiveChat: a chat when someone is there, a message left as a ticket when not, each handoff logged."
PLG_MCPASK_LIVECHAT_TYPE="LiveChat"
PLG_MCPASK_LIVECHAT_TYPE_DESC="Passes the visitor on to people in LiveChat. LiveChat's window is loaded only then, with the visitor's question, the AI's answer and the page for the people answering; outside office hours or with no one online, the visitor leaves a message in the same window, which LiveChat keeps as a ticket."
