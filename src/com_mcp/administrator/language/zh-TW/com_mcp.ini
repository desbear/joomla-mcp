COM_MCP_CONFIG_LOG_ARGUMENTS_DESC="同時儲存每次呼叫的參數（例如完整文章內文、搜尋字串、自訂欄位值）。預設為關閉，因為這會將該內容以明文複製到紀錄中，並保留至下方的保留天數到期。只有在稽核上真的需要這些細節時再開啟。"
