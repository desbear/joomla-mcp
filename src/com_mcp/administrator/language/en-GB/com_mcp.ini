COM_MCP_ACTION_VIEWLOG="View Activity Log"
COM_MCP_ACTION_VIEWLOG_DESC="Allows users in this group to open the MCP activity log. That log holds the full arguments of every user's tool calls (article text, search terms, custom field values), so it is denied by default: only Super Users can read it until you grant this permission here."

