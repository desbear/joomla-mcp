COM_MCP="MCP Server"
COM_MCP_XML_DESCRIPTION="MCP Server for Joomla: lets AI assistants such as Claude, ChatGPT, Cursor and VS Code query statistics, search, create, tag and publish content on this site through the Model Context Protocol."
