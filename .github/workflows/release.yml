name: Build package

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' src/pkg_mcp.xml | head -1)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "pkg_mcp.xml version $VERSION does not match tag $GITHUB_REF_NAME"; exit 1; }

      - name: Build
        run: build/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pkg_mcp
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --prerelease
